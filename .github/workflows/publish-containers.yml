name: Publish release containers

on:
  workflow_call:
    inputs:
      tag:
        description: Existing stable GitHub Release tag
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag to retry (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# Serialize releases and manual retries across both registries.
concurrency:
  group: veli-container-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'mksdr/Veli' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Resolve a published stable release on master
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Expected a stable vX.Y.Z tag');
            }
            const repo = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.draft || release.prerelease) throw new Error('Release must be published and stable');
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: tag });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${commit.sha}...master`
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Release commit must belong to master history');
            }
            core.setOutput('sha', commit.sha);

  regression:
    needs: resolve
    uses: ./.github/workflows/security-browser-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: docker.io
            image: mksdr/veli
          - registry: ghcr.io
            image: ghcr.io/mksdr/veli
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { releaseVersion } = require('./scripts/release-policy.cjs');
          const version = releaseVersion(process.env.RELEASE_TAG, require('./package.json').version);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ matrix.registry }}
          username: mksdr
          password: ${{ matrix.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}
      - name: Check immutable version tag
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /tmp/manifest.txt 2> /tmp/manifest-error.txt; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
            docker pull --platform linux/amd64 "$IMAGE@$digest"
            revision=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$digest")
            version=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$IMAGE@$digest")
            if [ "$revision" != "$RELEASE_SHA" ] || [ "$version" != "$VERSION" ]; then
              echo '::error::Existing version image belongs to a different release; refusing to reuse or overwrite it.'
              exit 1
            fi
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'manifest unknown|not found|no such manifest|name unknown' /tmp/manifest-error.txt; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest-error.txt >&2
            exit 1
          fi
      - name: Build image for smoke test
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: veli:smoke
          cache-from: type=gha,scope=veli-${{ matrix.registry }}
          cache-to: type=gha,scope=veli-${{ matrix.registry }},mode=max
      - name: Check the running container
        env:
          SMOKE_IMAGE: ${{ steps.existing.outputs.exists == 'true' && format('{0}@{1}', matrix.image, steps.existing.outputs.digest) || 'veli:smoke' }}
        run: |
          docker run --detach --name veli-smoke -p 127.0.0.1:3991:80 "$SMOKE_IMAGE"
          trap 'docker logs veli-smoke; docker rm --force veli-smoke' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --retry-max-time 60 --max-time 5 \
            http://127.0.0.1:3991/ --output /dev/null
          for path in / /about/ /generate-keys/ /headless/ /service-worker.js /404.html; do
            curl --fail --silent --show-error --max-time 10 \
              "http://127.0.0.1:3991${path}" --output /dev/null
          done
      - name: Publish immutable AMD64 and ARM64 version
        id: push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Veli
            org.opencontainers.image.source=https://github.com/mksdr/Veli
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=veli-${{ matrix.registry }}
          cache-to: type=gha,scope=veli-${{ matrix.registry }},mode=max
      - name: Attest GHCR image (including retries)
        if: matrix.registry == 'ghcr.io'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
          push-to-registry: true
      - name: Check whether this is still the newest stable release
        id: latest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { isNewestRelease } = require('./scripts/release-policy.cjs');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            });
            core.setOutput('promote', isNewestRelease(process.env.RELEASE_TAG, releases));
      - name: Promote newest version to latest without rebuilding
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Summarize registry result
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
          RESULT: ${{ job.status }}
          EXISTING: ${{ steps.existing.outputs.exists }}
          LATEST: ${{ steps.latest.outputs.promote }}
        run: |
          {
            echo "### $IMAGE:$VERSION — $RESULT"
            echo "Release commit: $SHA"
            echo "Version already existed: ${EXISTING:-unknown}; eligible for latest: ${LATEST:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
