name: Conventional PR title

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conventional-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE;
          const pattern = /^(feat|fix|perf|revert|docs|style|refactor|test|build|ci|chore)(?:\([^()\r\n]+\))?!?: \S[^\r\n]*$/u;
          if (!pattern.test(title) || title !== title.trim()) {
            throw new Error('Use <type>(<optional scope>): <description> (Conventional Commits).');
          }
          NODE
