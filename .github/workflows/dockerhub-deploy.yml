name: Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: dockerhub-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: mksdr/veli

jobs:
  publish:
    if: github.repository == 'mksdr/Veli' && (github.event_name == 'push' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate release version and credentials
        id: release
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_TOKEN repository secret before publishing."
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Only stable x.y.z package versions can be published.');
          }
          if (process.env.GITHUB_EVENT_NAME === 'push' &&
              process.env.GITHUB_REF !== `refs/tags/v${version}`) {
            throw new Error('The Git tag must match v' + version + ' from package.json.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: mksdr
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: veli:smoke
          cache-from: type=gha,scope=veli-dockerhub
          cache-to: type=gha,scope=veli-dockerhub,mode=max

      - name: Check the running container
        run: |
          docker run --detach --name veli-smoke -p 127.0.0.1:3991:80 veli:smoke
          trap 'docker logs veli-smoke; docker rm --force veli-smoke' EXIT
          # Docker can accept connections before nginx is ready to respond.
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 1 --retry-max-time 60 --max-time 5 \
            http://127.0.0.1:3991/ --output /dev/null
          for path in / /about/ /generate-keys/ /headless/ /service-worker.js /404.html; do
            curl --fail --silent --show-error --max-time 10 \
              "http://127.0.0.1:3991${path}" --output /dev/null
          done

      - name: Publish AMD64 and ARM64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Veli
            org.opencontainers.image.source=https://github.com/mksdr/Veli
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=veli-dockerhub
          cache-to: type=gha,scope=veli-dockerhub,mode=max
